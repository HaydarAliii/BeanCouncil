# Optional override: runs Ollama itself as a container instead of assuming it's already
# running on the host. Opt-in — layer this on top of the base compose file:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.ollama.yml up -d --build
#
# Targets a host with an NVIDIA GPU and the nvidia-container-toolkit installed (see README's
# "Local models as a container" section for the CPU-only fallback).

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No port exposed externally — only the backend reaches it, over the container network.

  # One-shot: pulls the configured models into the ollama_data volume on first boot, then exits.
  # Pulls are idempotent, so this is harmless to re-run on every `up`.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Comma-separated model list. Named OLLAMA_PULL_MODELS (not OLLAMA_MODELS) because
      # OLLAMA_MODELS is Ollama's own reserved setting for its model storage path.
      PULL_MODELS: ${OLLAMA_PULL_MODELS:-llama3.1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 1; done
        for m in $$(echo "$$PULL_MODELS" | tr ',' ' '); do echo "pulling $$m"; ollama pull "$$m"; done

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_data:
