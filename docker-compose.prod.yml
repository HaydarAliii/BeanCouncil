name: beancouncil

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmcouncil}
      POSTGRES_USER: ${POSTGRES_USER:-llmcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmcouncil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmcouncil}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Dışarıya port açılmıyor — sadece backend, container ağı üzerinden erişir.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-llmcouncil}
      POSTGRES_USER: ${POSTGRES_USER:-llmcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmcouncil}
      APP_CRYPTO_SECRET: ${APP_CRYPTO_SECRET:?APP_CRYPTO_SECRET .env.prod dosyasında tanımlı olmalı}
      APP_CRYPTO_SALT: ${APP_CRYPTO_SALT:?APP_CRYPTO_SALT .env.prod dosyasında tanımlı olmalı}
    depends_on:
      postgres:
        condition: service_healthy
    # Dışarıya port açılmıyor — sadece frontend'in nginx'i, container ağı üzerinden /api'yi proxy'ler.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?APP_AUTH_USERNAME .env.prod dosyasında tanımlı olmalı}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?APP_AUTH_PASSWORD .env.prod dosyasında tanımlı olmalı}
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
