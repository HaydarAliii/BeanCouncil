name: beancouncil

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmcouncil}
      POSTGRES_USER: ${POSTGRES_USER:-llmcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmcouncil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmcouncil}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No port exposed externally — only the backend reaches it, over the container network.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-llmcouncil}
      POSTGRES_USER: ${POSTGRES_USER:-llmcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmcouncil}
      APP_CRYPTO_SECRET: ${APP_CRYPTO_SECRET:?APP_CRYPTO_SECRET must be set in .env.prod}
      APP_CRYPTO_SALT: ${APP_CRYPTO_SALT:?APP_CRYPTO_SALT must be set in .env.prod}
    depends_on:
      postgres:
        condition: service_healthy
    # No port exposed externally — only the frontend's nginx proxies /api, over the container network.

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:?APP_AUTH_USERNAME must be set in .env.prod}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?APP_AUTH_PASSWORD must be set in .env.prod}
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
