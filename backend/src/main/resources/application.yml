spring:
  application:
    name: llm-council
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:llmcouncil}
    username: ${POSTGRES_USER:llmcouncil}
    password: ${POSTGRES_PASSWORD:llmcouncil}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

llm:
  council:
    president: g4f:gpt-4o-mini
  providers:
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      model: llama-3.3-70b-versatile
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
    g4f:
      base-url: ${G4F_BASE_URL:http://localhost:1337/v1}
      model-a: gpt-4o-mini
      model-b: gemini-2.5-flash

resilience4j:
  retry:
    instances:
      llmProvider:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      llmProvider:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 2s
