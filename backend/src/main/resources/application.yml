spring:
  application:
    name: llm-council
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:llmcouncil}
    username: ${POSTGRES_USER:llmcouncil}
    password: ${POSTGRES_PASSWORD:llmcouncil}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

llm:
  providers:
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      model: llama-3.3-70b-versatile

resilience4j:
  retry:
    instances:
      llmProvider:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      llmProvider:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 2s
