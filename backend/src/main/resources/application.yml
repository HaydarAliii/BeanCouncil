spring:
  application:
    name: llm-council
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:llmcouncil}
    username: ${POSTGRES_USER:llmcouncil}
    password: ${POSTGRES_PASSWORD:llmcouncil}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

llm:
  providers:
    openrouter:
      base-url: https://openrouter.ai/api/v1
    tavily:
      base-url: https://api.tavily.com

app:
  crypto:
    secret: ${APP_CRYPTO_SECRET:}
    salt: ${APP_CRYPTO_SALT:}

resilience4j:
  retry:
    instances:
      llmProvider:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      llmProvider:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 2s
