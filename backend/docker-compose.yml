name: llmcouncil

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-council-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmcouncil}
      POSTGRES_USER: ${POSTGRES_USER:-llmcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmcouncil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmcouncil"]
      interval: 5s
      timeout: 5s
      retries: 5

  reverse-api:
    # gpt4free (g4f): key gerektirmeyen, OpenAI-uyumlu ücretsiz reverse API
    image: hlohaus789/g4f:latest-slim
    container_name: llm-council-reverse-api
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "1337:8080"
    volumes:
      - ./g4f/har_and_cookies:/app/har_and_cookies
      - ./g4f/generated_media:/app/generated_media

volumes:
  postgres_data:
