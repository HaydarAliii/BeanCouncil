server {
    listen 80;
    server_name _;

    # Tek kullanıcılık şifre koruması — .htpasswd container başlarken
    # APP_AUTH_USERNAME/APP_AUTH_PASSWORD'den üretilir (bkz. docker-entrypoint.d/40-generate-htpasswd.sh).
    auth_basic "BeanCouncil";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # React Router olmasa da (tek sayfa), doğrudan URL ile yenilemede 404 almamak için SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend'e aynı origin üzerinden proxy — tarayıcı için ayrı bir host olmadığından CORS gerekmez.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
