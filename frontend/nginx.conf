server {
    listen 80;
    server_name _;

    # Single-user password protection — .htpasswd is generated on container start
    # from APP_AUTH_USERNAME/APP_AUTH_PASSWORD (see docker-entrypoint.d/40-generate-htpasswd.sh).
    auth_basic "BeanCouncil";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so a direct URL refresh doesn't 404 (single page, no React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the backend on the same origin — no separate host for the browser, so no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
