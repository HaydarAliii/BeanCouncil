name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Most tests use pure Mockito/MockWebServer, but the JPA integration tests spin up a real
      # Postgres via Testcontainers — ubuntu-latest ships Docker preinstalled, so this just works.
      - run: mvn -B test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Runs on jsdom, needs no Docker/browser binary (Round 1).
      - run: npm test
      # build runs tsc -b (type checking) together with vite build.
      - run: npm run build
